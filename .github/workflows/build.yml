name: Build Ibuprobridging

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibuprofen-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: ver
        run: |
          base="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${base}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Tests & Build JAR
        run: ./gradlew test build -Pmod_version="${{ steps.ver.outputs.version }}" --stacktrace

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          cp build/libs/ibuprobridging-*.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -la dist/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ibuprobridging-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Update rolling latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_HEAD=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$GITHUB_SHA" != "$MAIN_HEAD" ]]; then
            echo "Skipping superseded commit."
            exit 0
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          NOTES="Rolling build from \`main\` commit \`${SHORT_SHA}\` ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
              if [[ "$asset" == ibuprobridging-*.jar && ! -f "dist/$asset" ]]; then
                gh release delete-asset latest "$asset" -y
              fi
            done
            gh release edit latest \
              --title "Ibuprobridging Latest (main-${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create latest dist/* \
              --target "$GITHUB_SHA" \
              --title "Ibuprobridging Latest (main-${SHORT_SHA})" \
              --notes "$NOTES" \
              --prerelease
          fi
